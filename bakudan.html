<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆弾解除ハック - Bomb Hack</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 15px;
            font-family: 'Courier New', Consolas, monospace;
            background-color: #050505; color: #00ff66; text-align: center;
        }
        .card {
            background-color: #111; border: 2px solid #00ff66; border-radius: 12px;
            padding: 20px; max-width: 650px; margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
        h1 { margin: 5px 0; font-size: 26px; color: #00ff66; text-shadow: 0 0 8px #00ff66; }
        
        .mode-select {
            margin: 10px 0 20px; background: #222; padding: 8px; border-radius: 8px;
        }
        select {
            padding: 6px; font-size: 14px; background: #000; color: #00ff66;
            border: 1px solid #00ff66; border-radius: 4px;
        }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px;
        }
        .timer { font-size: 24px; font-weight: bold; color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        .score { font-size: 18px; font-weight: bold; }

        .target-box {
            background: #220000; border: 2px solid #ff0055; padding: 10px;
            border-radius: 8px; margin-bottom: 15px;
        }
        .target-code { font-size: 32px; font-weight: bold; color: #ffcc00; letter-spacing: 4px; }

        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px;
        }
        .code-btn {
            background: #002200; border: 1px solid #00ff66; color: #00ff66;
            padding: 15px 5px; font-size: 20px; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: all 0.1s;
        }
        .code-btn:hover { background: #005500; }
        .code-btn:active { transform: scale(0.95); }

        .msg { height: 28px; font-size: 16px; font-weight: bold; color: #ffcc00; margin-bottom: 10px; }

        .btn-main {
            padding: 12px 30px; font-size: 18px; font-weight: bold;
            background: #00ff66; color: #000; border: none; border-radius: 6px;
            cursor: pointer; box-shadow: 0 0 10px #00ff66;
        }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h1>💣 BOMB HACK 💣</h1>
        <p style="margin: 5px 0 10px; font-size: 12px; color: #aaa;">流れるデータからターゲットの「解除コード」を見つけてタップしろ！</p>

        <div class="mode-select">
            モード: 
            <select id="game-mode" onchange="resetGame()">
                <option value="cpu">1人プレイ (vs CPU)</option>
                <option value="2p">2人ローカル対戦</option>
            </select>
        </div>

        <div class="status-bar">
            <div class="score" style="color:#00ccff;">1P: <span id="score-1p">0</span></div>
            <div class="timer">⏱️ <span id="time">20</span>s</div>
            <div class="score" style="color:#ff3366;"><span id="p2-label">CPU</span>: <span id="score-2p">0</span></div>
        </div>

        <div class="target-box">
            <div style="font-size: 12px; color: #ff8888;">TARGET CODE</div>
            <div class="target-code" id="target-code">----</div>
        </div>

        <div class="msg" id="msg">「ゲーム開始」を押してください</div>

        <div class="grid" id="grid">
            <!-- ボタンがここに動的生成されます -->
        </div>

        <button id="btn-start" class="btn-main" onclick="startGame()">ゲーム開始！</button>
    </div>

    <script>
        let mode = 'cpu';
        let score1P = 0, score2P = 0;
        let timeLeft = 20;
        let timerInterval = null;
        let targetNum = 0;
        let isPlaying = false;
        let cpuTimer = null;

        function resetGame() {
            clearInterval(timerInterval);
            clearTimeout(cpuTimer);
            isPlaying = false;
            
            mode = document.getElementById('game-mode').value;
            document.getElementById('p2-label').textContent = mode === 'cpu' ? 'CPU' : '2P';
            
            score1P = 0; score2P = 0;
            timeLeft = 20;
            document.getElementById('score-1p').textContent = '0';
            document.getElementById('score-2p').textContent = '0';
            document.getElementById('time').textContent = '20';
            document.getElementById('target-code').textContent = '----';
            document.getElementById('msg').textContent = '「ゲーム開始」を押してください';
            document.getElementById('grid').innerHTML = '';
            document.getElementById('btn-start').style.display = 'inline-block';
        }

        function startGame() {
            resetGame();
            isPlaying = true;
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('msg').textContent = 'コードを解除せよ！';

            nextRound();

            // タイマー開始
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function nextRound() {
            if (!isPlaying) return;
            clearTimeout(cpuTimer);

            // 1000〜9999のランダムコード生成
            const numbers = [];
            while (numbers.length < 12) {
                const n = Math.floor(Math.random() * 9000) + 1000;
                if (!numbers.includes(n)) numbers.push(n);
            }

            // 正解を設定
            targetNum = numbers[Math.floor(Math.random() * numbers.length)];
            document.getElementById('target-code').textContent = targetNum;

            // グリッド生成
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            numbers.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'code-btn';
                btn.textContent = num;
                btn.onclick = () => playerTap(num);
                grid.appendChild(btn);
            });

            // CPUモードの場合、CPUにランダムな時間で答えさせる
            if (mode === 'cpu') {
                const cpuSpeed = Math.random() * 1500 + 800; // 0.8秒〜2.3秒
                cpuTimer = setTimeout(() => {
                    if (isPlaying) {
                        score2P++;
                        document.getElementById('score-2p').textContent = score2P;
                        document.getElementById('msg').textContent = '🤖 CPUに先を越された！';
                        document.getElementById('msg').style.color = '#ff3366';
                        nextRound();
                    }
                }, cpuSpeed);
            }
        }

        function playerTap(num) {
            if (!isPlaying) return;

            if (num === targetNum) {
                score1P++;
                document.getElementById('score-1p').textContent = score1P;
                document.getElementById('msg').textContent = '⭕ 解除成功！(+1)';
                document.getElementById('msg').style.color = '#00ff66';
                nextRound();
            } else {
                // お手つきペナルティ
                document.getElementById('msg').textContent = '❌ コード不一致！';
                document.getElementById('msg').style.color = '#ff0055';
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(cpuTimer);

            document.getElementById('target-code').textContent = 'BOOM!!';
            document.getElementById('grid').innerHTML = '';
            
            const msg = document.getElementById('msg');
            const p2Name = mode === 'cpu' ? 'CPU' : '2P';

            if (score1P > score2P) {
                msg.textContent = `🎉 1Pの勝利！ (${score1P} vs ${score2P})`;
                msg.style.color = '#00ccff';
            } else if (score2P > score1P) {
                msg.textContent = `🎉 ${p2Name}の勝利！ (${score1P} vs ${score2P})`;
                msg.style.color = '#ff3366';
            } else {
                msg.textContent = `🤝 引き分け！ (${score1P} 同点)`;
                msg.style.color = '#ffcc00';
            }

            document.getElementById('btn-start').style.display = 'inline-block';
            document.getElementById('btn-start').textContent = 'もう一度あそぶ';
        }
    </script>
</body>
</html>
